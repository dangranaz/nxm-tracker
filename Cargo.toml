[package]
name = "nxm_tracker"
version = "0.10.0"
edition = "2021"
license = "PolyForm Noncommercial 1.0.0"
description = "Tracker for long, multi-day work sessions and the integrated feature sessions created after the design phase"

[dependencies]
tracing = "0.1"
nxm-config = { path = "../../shared/nxm-config" }
nxm-logging = { path = "../../shared/nxm-logging" }
nxm-db = { path = "../../shared/nxm-db", package = "nxm_db" }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
nxm-mcp-server = { path = "../../shared/nxm-mcp-server", package = "nxm_mcp_server" }

# Standalone crate: empty [workspace] so Cargo never walks up into a parent
# directory's manifest.
[workspace]

[[bin]]
name = "nxm-tracker"
path = "src/main.rs"

# --- DEV: fastest possible compile/test cycle ---
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

# DEPENDENCIES optimized even in dev: compiled once (then in the sccache cache)
# but their code runs fast during our tests.
[profile.dev.package."*"]
opt-level = 2

# --- RELEASE: runtime-optimized binary for stable products ---
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# --- PROFILING: release WITH symbols, for samply/flamegraph ---
[profile.profiling]
inherits = "release"
debug = true
strip = false

# --- BENCH: symbols for benchmark profiling ---
[profile.bench]
debug = 1
